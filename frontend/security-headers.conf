# Security headers for everything nginx serves itself (the SPA and its assets).
#
# One file for both deployment shapes: the frontend container (frontend/nginx.conf) and the
# all-in-one image (docker/nginx.conf) copy it to /etc/nginx/security-headers.conf and include
# it in every location that serves files. Proxied locations (/api/, /carddav/, /health) do NOT
# include it: the backend sends its own headers there (a strict `default-src 'none'`), and
# adding more would send them twice. `make i18n-check` (scripts/security-headers.test.mjs)
# fails when a config drifts from this.
#
# nginx does not inherit add_header into a location that sets its own, which is why this is an
# include per location and not one block at server level.
#
# Content-Security-Policy for the single-page app:
#   script-src 'self'          the bundle only, no inline scripts, no eval
#   style-src 'unsafe-inline'  MUI/emotion injects <style> tags at runtime
#   img-src data: blob:        avatars and uploaded photo previews
#   connect-src 'self'         the API is same-origin behind nginx
# An API on another origin, or any embedded third-party content, needs this relaxed (see
# docs/deployment.md, "Security headers").
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Only over HTTPS: $hsts_header (defined in the main config) is empty for plain HTTP, and nginx
# does not send a header with an empty value. No includeSubDomains here: the scheme comes from
# a header, and other subdomains are not nginx's to commit to HTTPS.
add_header Strict-Transport-Security $hsts_header always;
