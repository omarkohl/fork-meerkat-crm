name: Deploy docs to GitHub Pages

on:
  push:
    branches: ["main"]
    paths: ["docs/**"]
  # Pull requests only build the site (no deploy), so a broken Jekyll build is caught before merge.
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Deploys queue (never cancelled mid-deploy); each PR has its own group so it cannot block them.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # The site is upstream's (fbuchner.github.io); forks do not build or deploy it.
    if: github.repository == 'fbuchner/meerkat-crm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Build
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path || '' }}"
        working-directory: docs
        env:
          JEKYLL_ENV: production
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/_site/

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
