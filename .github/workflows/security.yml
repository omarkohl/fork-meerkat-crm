name: Security

on:
  push:
    branches: [main, omk]
  pull_request:
  workflow_dispatch:
  schedule:
    # New advisories appear without code changes; re-check weekly.
    - cron: "17 5 * * 1"

# The runners ship yarn; the Makefile default (corepack yarn) needs a packageManager field.
env:
  YARN: yarn

jobs:
  govulncheck:
    permissions:
      contents: read
    name: Backend (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: backend/go.sum

      # Fails when a vulnerable function is actually reachable from our code.
      - name: Run govulncheck
        run: make vuln-go

  frontend-audit:
    permissions:
      contents: read
    name: Frontend (yarn audit, production, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Only runtime dependencies at high or critical severity fail the job;
      # dev tooling and lower severities are left to Dependabot.
      - name: Audit production dependencies
        run: make audit-frontend
