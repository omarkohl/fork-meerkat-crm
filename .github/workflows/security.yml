name: Security

on:
  push:
    branches: [main, omk]
  pull_request:
  workflow_dispatch:
  schedule:
    # New advisories appear without code changes; re-check weekly.
    - cron: "17 5 * * 1"

jobs:
  govulncheck:
    permissions:
      contents: read
    name: Backend (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: backend/go.sum

      # Fails when a vulnerable function is actually reachable from our code.
      - name: Run govulncheck
        run: make vuln-go

  frontend-audit:
    permissions:
      contents: read
    name: Frontend (yarn audit, production, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # Only runtime dependencies at high or critical severity fail the job;
      # dev tooling and lower severities are left to Dependabot.
      - name: Audit production dependencies
        run: make audit-frontend
