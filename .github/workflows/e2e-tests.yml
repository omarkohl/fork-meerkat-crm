name: E2E Tests

on:
  push:
    branches: [main, omk]
  pull_request:

# The runners ship yarn; the Makefile default (corepack yarn) needs a packageManager field.
env:
  YARN: yarn

jobs:
  e2e:
    permissions:
      contents: read
      actions: read
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build all-in-one image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: meerkat-crm-test:latest
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

      - name: Start services
        run: |
          docker compose -f docker-compose.test.yml up -d
          # Wait for the app to be ready (frontend + same-origin /api on 7300)
          echo "Waiting for services to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7300/health > /dev/null 2>&1; do sleep 2; done'
          echo "App is ready"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: make install-frontend

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: make test-e2e-docker
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Meerkat logs (nginx + backend under supervisord) ==="
          docker compose -f docker-compose.test.yml logs meerkat

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
