name: Docker build and scan

# Builds every image without pushing it and scans it with Trivy, so a broken
# Dockerfile or a fixable HIGH/CRITICAL vulnerability in a base image or package
# shows up on the pull request instead of at release time. The weekly run catches
# advisories that appear without code changes.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'Dockerfile'
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - '.dockerignore'
      - '.trivyignore'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * 1'

jobs:
  build-and-scan:
    permissions:
      contents: read
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: All-in-one image
            context: .
            file: ./Dockerfile
          - name: Backend image
            context: ./backend
            file: ./backend/Dockerfile
          - name: Frontend image
            context: ./frontend
            file: ./frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image (not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: meerkat-scan:latest
          cache-from: type=gha,scope=scan-${{ matrix.file }}
          cache-to: type=gha,scope=scan-${{ matrix.file }},mode=max

      # Fails on HIGH/CRITICAL findings that have a fix available. Findings without a
      # fix are ignored (nothing to do about them yet); accepted exceptions go into
      # .trivyignore with a reason and an expiry date.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: meerkat-scan:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
