name: Fuzz

# Short fuzz runs of the parsers that read untrusted input. Nightly and on demand, not on
# pull requests (a run is a lottery, a red PR check for it would be noise). A failing
# input is uploaded as an artifact; copy it to backend/<package>/testdata/fuzz/<Target>/
# and it becomes a regression test that `go test` runs every time.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Time per target (Go duration, e.g. 30s, 5m; at most 15m, the job times out at 20m)"
        required: false
        default: "30s"

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: ./carddav, target: FuzzVCardToContact }
          - { package: ./carddav, target: FuzzDecodePhoto }
          - { package: ./services, target: FuzzCSVImport }
          - { package: ./services, target: FuzzImportValueParsers }
          - { package: ./services, target: FuzzMonicaMapping }
          - { package: ./services, target: FuzzICSText }
          - { package: ./services, target: FuzzBuildICSFeed }

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: Fuzz
        env:
          FUZZ_PACKAGE: ${{ matrix.package }}
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_TIME: ${{ inputs.fuzztime || '30s' }}
        run: make fuzz

      # Go writes a failing input to testdata/fuzz/<Target>/ next to the committed seeds;
      # only the files that are not tracked are new.
      - name: Collect failing inputs
        if: ${{ failure() }}
        run: |
          mkdir -p failing-inputs
          git ls-files --others --exclude-standard -- 'backend/**/testdata/fuzz/**' |
            while read -r f; do mkdir -p "failing-inputs/$(dirname "$f")"; cp "$f" "failing-inputs/$f"; done
          find failing-inputs -type f

      - name: Upload failing inputs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failing-input-${{ matrix.target }}
          path: failing-inputs
          if-no-files-found: ignore
          retention-days: 30
